# =============================================================================
# NAS Cloud Sync Client — CI/CD Pipeline
# =============================================================================
# Build, test, package and sign the MSIX on GitHub-hosted Windows runners.
# windows-latest includes Visual Studio 2022 + AppxPackage tools.
# =============================================================================

name: Build & Package

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      sign_package:
        description: "Sign the MSIX package"
        required: false
        default: true
        type: boolean

env:
  DOTNET_VERSION: "8.0.x"
  BUILD_CONFIGURATION: ${{ github.event.inputs.build_configuration || 'Release' }}
  ARTIFACT_NAME: "NasSync-Package"
  SOLUTION_FILE: "NasSync.sln"

jobs:
  # ===========================================================================
  # Build & Test
  # ===========================================================================
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild (for WAP project)
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.wapproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution (with WinRT enabled)
        run: |
          dotnet build ${{ env.SOLUTION_FILE }} `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-restore `
            /p:DefineConstants="WINRT_ENABLED%3BTRACE"
        shell: pwsh

      - name: Run unit tests
        run: |
          dotnet test ${{ env.SOLUTION_FILE }} `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-build `
            --verbosity normal `
            --collect:"XPlat Code Coverage" `
            --results-directory TestResults `
            --filter "FullyQualifiedName!~IntegrationTest"
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 14

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ env.BUILD_CONFIGURATION }}
          path: |
            src/*/bin/${{ env.BUILD_CONFIGURATION }}/
            tests/*/bin/${{ env.BUILD_CONFIGURATION }}/
            !src/*/bin/${{ env.BUILD_CONFIGURATION }}/**/*.pdb
            !tests/*/bin/${{ env.BUILD_CONFIGURATION }}/**/*.pdb
          retention-days: 7

  # ===========================================================================
  # Package & Sign MSIX
  # ===========================================================================
  package:
    name: Package MSIX
    runs-on: windows-latest
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.wapproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # Generate a self-signed certificate for MSIX signing
      - name: Generate self-signed certificate
        if: github.event.inputs.sign_package != 'false'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=NasSync Developer, O=NasSync, C=US" `
            -KeyUsage DigitalSignature `
            -FriendlyName "NasSync CI Signing Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
            -NotAfter (Get-Date).AddYears(1)

          $certPath = "ci-signing-cert.pfx"
          $certPassword = ConvertTo-SecureString -String "NasSyncCI2026" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $certPath -Password $certPassword

          # Export the public cert (.cer) for users to trust
          Export-Certificate -Cert $cert -FilePath "NasSync-CI-PublicKey.cer"

          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"
          Write-Host "Certificate subject: $($cert.Subject)"

          # Store thumbprint for packaging step
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # Build the solution with WinRT enabled first
      - name: Build solution
        run: |
          dotnet build ${{ env.SOLUTION_FILE }} `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-restore `
            /p:DefineConstants="WINRT_ENABLED%3BTRACE"
        shell: pwsh

      # Build and publish the WAP project
      - name: Build and publish MSIX package
        shell: pwsh
        run: |
          msbuild src/NasSync.Package/NasSync.Package.wapproj `
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
            /p:Platform=x64 `
            /p:DefineConstants="WINRT_ENABLED" `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="../publish/" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /t:Build

      # Sign the MSIX if certificate was generated
      - name: Sign MSIX package
        if: github.event.inputs.sign_package != 'false'
        shell: pwsh
        run: |
          $msixFiles = Get-ChildItem -Path "publish/" -Filter "*.msix" -Recurse
          if ($msixFiles.Count -eq 0) {
            Write-Warning "No MSIX files found in publish/ directory"
            Get-ChildItem -Path "publish/" -Recurse | ForEach-Object { Write-Host $_.FullName }
          } else {
            foreach ($msix in $msixFiles) {
              Write-Host "Signing: $($msix.FullName)"
              & signtool sign /fd SHA256 /a /f "ci-signing-cert.pfx" /p "NasSyncCI2026" $msix.FullName
              Write-Host "Signed successfully."
            }
          }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            publish/**/*.msix
            NasSync-CI-PublicKey.cer
          retention-days: 30
          if-no-files-found: warn

  # ===========================================================================
  # Release (only on tagged commits)
  # ===========================================================================
  release:
    name: Create Release
    runs-on: windows-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.msix
            artifacts/**/*.cer
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
