# =============================================================================
# NAS Cloud Sync Client — CI/CD Pipeline
# =============================================================================
# Build, test, package and sign the MSIX on GitHub-hosted Windows runners.
# windows-latest includes Visual Studio 2022 + AppxPackage tools.
# =============================================================================

name: Build & Package

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      sign_package:
        description: "Sign the MSIX package"
        required: false
        default: true
        type: boolean

env:
  DOTNET_VERSION: "8.0.x"
  BUILD_CONFIGURATION: ${{ github.event.inputs.build_configuration || 'Release' }}
  ARTIFACT_NAME: "NasSync-Package"
  SOLUTION_FILE: "NasSync.sln"

jobs:
  # ===========================================================================
  # Build & Test
  # ===========================================================================
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild (for WAP project)
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.wapproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution (with WinRT enabled)
        run: |
          dotnet build ${{ env.SOLUTION_FILE }} `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-restore `
            /p:DefineConstants="WINRT_ENABLED%3BTRACE"
        shell: pwsh

      - name: Run unit tests
        run: |
          dotnet test ${{ env.SOLUTION_FILE }} `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-build `
            --verbosity normal `
            --collect:"XPlat Code Coverage" `
            --results-directory TestResults `
            --filter "FullyQualifiedName!~IntegrationTest"
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 14

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ env.BUILD_CONFIGURATION }}
          path: |
            src/*/bin/${{ env.BUILD_CONFIGURATION }}/
            tests/*/bin/${{ env.BUILD_CONFIGURATION }}/
            !src/*/bin/${{ env.BUILD_CONFIGURATION }}/**/*.pdb
            !tests/*/bin/${{ env.BUILD_CONFIGURATION }}/**/*.pdb
          retention-days: 7

      # Publish self-contained tray app for direct execution (no MSIX needed)
      - name: Publish NasSync Tray (self-contained)
        run: |
          dotnet publish src/NasSync.Tray/NasSync.Tray.csproj `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --runtime win-x64 `
            --self-contained true `
            --output ./tray-publish `
            /p:DefineConstants="WINRT_ENABLED%3BTRACE"
        shell: pwsh

      - name: Upload tray app artifact
        uses: actions/upload-artifact@v4
        with:
          name: NasSync-Tray-${{ env.BUILD_CONFIGURATION }}
          path: tray-publish/
          retention-days: 14

  # ===========================================================================
  # Package & Sign MSIX
  # ===========================================================================
  package:
    name: Package MSIX
    runs-on: windows-latest
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.wapproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # Use persistent certificate from secret if available, otherwise generate new one
      - name: Setup signing certificate
        shell: pwsh
        run: |
          $certSecret = "${{ secrets.MSIX_SIGNING_CERT_BASE64 }}"
          $certPassword = "${{ secrets.MSIX_SIGNING_CERT_PASSWORD }}"

          if ($certSecret -and $certPassword) {
            Write-Host "Using persistent signing certificate from GitHub Secret"
            $pfxBytes = [System.Convert]::FromBase64String($certSecret)
            [System.IO.File]::WriteAllBytes("ci-signing-cert.pfx", $pfxBytes)
            echo "CERT_PASSWORD=$certPassword" >> $env:GITHUB_ENV
            echo "CERT_FROM_SECRET=true" >> $env:GITHUB_ENV
            Write-Host "Certificate loaded ($(Get-Item 'ci-signing-cert.pfx').Length bytes)"
          } else {
            Write-Host "No signing secret configured — generating ephemeral certificate"
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=NasSync Developer, O=NasSync, C=US" `
              -KeyUsage DigitalSignature `
              -FriendlyName "NasSync CI Signing Certificate" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
              -NotAfter (Get-Date).AddYears(1)

            $pfxPassword = ConvertTo-SecureString -String "NasSyncCI2026" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath "ci-signing-cert.pfx" -Password $pfxPassword
            Export-Certificate -Cert $cert -FilePath "NasSync-CI-PublicKey.cer"

            echo "CERT_PASSWORD=NasSyncCI2026" >> $env:GITHUB_ENV
            echo "CERT_FROM_SECRET=false" >> $env:GITHUB_ENV
            echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
            Write-Host "Ephemeral certificate thumbprint: $($cert.Thumbprint)"
          }

      # Build the solution with WinRT enabled first
      - name: Build solution
        run: |
          dotnet build ${{ env.SOLUTION_FILE }} `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-restore `
            /p:DefineConstants="WINRT_ENABLED%3BTRACE"
        shell: pwsh

      # Publish the tray app as self-contained
      - name: Publish NasSync Tray
        shell: pwsh
        run: |
          dotnet publish src/NasSync.Tray/NasSync.Tray.csproj `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --runtime win-x64 `
            --self-contained true `
            --output ./publish/NasSync `
            /p:DefineConstants="WINRT_ENABLED%3BTRACE"

      # Package as MSIX using MakeAppx
      - name: Create MSIX package
        shell: pwsh
        run: |
          # Copy packaging files to output
          New-Item -ItemType Directory -Force "publish/NasSync/Assets" | Out-Null
          Copy-Item "src/NasSync.Package/Package.appxmanifest" "publish/NasSync/AppxManifest.xml"
          Copy-Item "src/NasSync.Package/Assets/*" "publish/NasSync/Assets/" -Force

          # Create _resources subfolder for PRI
          New-Item -ItemType Directory -Force "publish/NasSync/_resources" | Out-Null

          # Find MakeAppx.exe
          $makeAppx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeAppx) {
            Write-Error "makeappx.exe not found"
            exit 1
          }

          Write-Host "Using: $($makeAppx.FullName)"

          # Create MSIX
          & $makeAppx.FullName pack /d "publish/NasSync" /p "publish/NasSync.msix" /o /nv

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MakeAppx failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "MSIX created: publish/NasSync.msix"
          Get-Item "publish/NasSync.msix" | Select-Object Name, Length

      # Sign the MSIX if certificate was generated
      - name: Sign MSIX package
        if: github.event.inputs.sign_package != 'false'
        shell: pwsh
        run: |
          # Find signtool.exe
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Error "signtool.exe not found"
            exit 1
          }

          Write-Host "Using: $($signtool.FullName)"

          $msixFiles = Get-ChildItem -Path "publish/" -Filter "*.msix"
          if ($msixFiles.Count -eq 0) {
            Write-Warning "No MSIX files found in publish/ directory"
            Get-ChildItem -Path "publish/" -Recurse | ForEach-Object { Write-Host $_.FullName }
          } else {
            foreach ($msix in $msixFiles) {
              Write-Host "Signing: $($msix.FullName)"
              & $signtool.FullName sign /fd SHA256 /a /f "ci-signing-cert.pfx" /p "$env:CERT_PASSWORD" $msix.FullName
              Write-Host "Signed successfully."
            }
          }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            publish/*.msix
            NasSync-CI-PublicKey.cer
          retention-days: 30
          if-no-files-found: error

  # ===========================================================================
  # Release (only on tagged commits)
  # ===========================================================================
  release:
    name: Create Release
    runs-on: windows-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.msix
            artifacts/**/*.cer
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
